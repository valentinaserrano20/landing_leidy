    <div class="card2 card2__s--hover">
        <h1 class="card2__titulo">Ferrari</h1>

        <div class="cotiza__cel">

        <div class="cotiza__f">

        </div>
        <div class="cotiza__e">
            <h2 class="cotiza__e-mail">E-mail</h2>
            <input type="email" class="cotiza__llemail">
        </div>
        <div class="cotiza__m">
            <h2 class="cotiza__modelos">Modelos</h2>
            <input type="text" class="cotiza__llmodelos">
        </div>
        <div class="cotiza__ciu">
            <h2 class="cotiza__ciudad">Ciudad</h2>
            <input type="text" class="cotiza__llciudad">
        </div>
        <div class="cotiza__con">
            <h2 class="cotiza__conc">Concesionario</h2>
            <input type="text" class="cotiza__llconc">
        </div>
        <div class="cotiza__req">
